# Porpoise's recommended settings, per game.
#
# Porpoise downloads this file once a day and shows a game's entry in its
# settings (Game settings > Recommended > Porpoise's picks), where the player
# can apply it with one press. Dolphin's own fixes for each game
# (Sys/GameSettings) are shown there too; they need no entry here.
#
# A section is a disc ID: six characters for one region (GM4E01), or the first
# three for every region of the game (GM4). The six-character entry wins.
#   note = one line on why, shown to the player
#   any other line = a Porpoise setting, as settings.ini writes it, or one of
#   Dolphin's own as dolphin.<Section>.<Key> (the sections and keys of Dolphin's
#   GameSettings files, e.g. dolphin.Video_Hacks.EFBToTextureEnable = True);
#   Porpoise's settings are:
#     resolution 1..6 (3 = 1080p)      shader_mode 0..3 (2 = async ubershaders)
#     wide 0..2 (Widescreen: Auto, On, Off)   aspect 0..3 (Auto, 16:9, 4:3, Stretch)
#     antialiasing 0..6                 anisotropy 0..4
#     texture_cache 0..2 (Fast, Middle, Safe)
#     cpu_clock 0..9 (5 = 100%)         dual_core 0/1
#     screen_filter 0..5 (Smooth, Sharp, Sharpen, CRT, Arcade CRT, VHS)
#     filter_strength 1..10             border (glass, midnight, arcade)
#     skip_dupes 0/1   pixel_lighting 0/1   disable_fog 0/1   crop_overscan 0/1
#
# Example (not a real recommendation):
#   [GXXE01]
#   note = Steady 60 at 2x; Safe texture cache fixes the pause menu text.
#   resolution = 2
#   texture_cache = 2

# WWE Day of Reckoning 2. Dolphin's own fix keeps EFB copies in RAM, which makes
# the PS5's GPU hand every copy back to the CPU: about 6 fps here. Keeping the
# copies on the GPU, and decoding textures there, is the first thing to try.
[GW2]
note = Faster on PS5: EFB copies stay on the GPU and textures decode there. A few effects may look different. Still being tested.
dolphin.Video_Hacks.EFBToTextureEnable = True
dolphin.Video_Settings.EnableGPUTextureDecoding = True
