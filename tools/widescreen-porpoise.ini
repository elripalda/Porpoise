# Porpoise's own widescreen codes, added to assets/widescreen/codes.ini by
# tools/make-widescreen.py. Off until tested: a choice in the game's Cheats
# and Patches (with Aspect Ratio set to Force 16:9).
#
# Mario Superstar Baseball (US): the game builds its 3D view with the SDK's
# C_MTXFrustum (0x800759A4 in GYQE01, from the roeming/mssb-dtk decomp's
# symbols, CC0). The hook widens left and right by a sixth of the width each
# (4:3 to 16:9), then runs the function's own first instruction
# (fsubs f9,f4,f3). The HUD, drawn with C_MTXOrtho, stays as it is.
#   mflr r12 / bl +8 / .float 1/6 / mflr r11 / mtlr r12 / lfs f0,0(r11)
#   fsubs f9,f4,f3 / fmuls f13,f9,f0 / fadds f4,f4,f13 / fsubs f3,f3,f13
#   fsubs f9,f4,f3
# It's put in only when that first instruction is there (20: if equal; E0:
# end if), so another revision of the disc is left alone.
